name: ci

# Corre en cada push y cada pull request. Son exactamente las mismas
# comprobaciones que CONTRIBUTING.md pide correr en local, en el mismo orden,
# para que «pasa en mi máquina» y «pasa en CI» signifiquen lo mismo.
#
# build.yml también lo llama (workflow_call) antes de compilar un release: así
# lo que se publica pasó por exactamente la misma lista, sin copiarla.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

# Un push nuevo sobre la misma rama cancela la ejecución anterior. Cuando lo
# llama build.yml, `github.workflow` es «build»: el grupo lleva el nombre para
# que un push a main no cancele las comprobaciones de un release lanzado a mano
# desde main, ni al revés.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Interfaz (tipos + pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Comprobar tipos
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Pruebas del frontend
        run: pnpm test

      - name: Compilar la interfaz
        run: pnpm build

  rust:
    name: Núcleo (clippy + pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri necesita estas bibliotecas para compilar en Linux. El núcleo se
      # prueba aquí y no en los runners nativos porque nada de lo que se prueba
      # —esquema, consultas y escaneo— depende del sistema operativo, y un
      # runner de Linux es bastante más rápido y barato.
      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            build-essential file

      # `rustfmt` hay que pedirlo: la acción instala el perfil mínimo, que no lo
      # trae, y `cargo fmt` fallaría con «'rustfmt' is not installed».
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"

      # Va antes que clippy porque es lo más barato que puede fallar, y porque
      # un diff de formato enterrado bajo avisos de clippy se lee peor. La
      # configuración está en src-tauri/rustfmt.toml.
      - name: Formato
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Pruebas del núcleo
        run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: Dependencias (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Binario precompilado: `cargo install cargo-audit` tarda ~4 minutos en
      # compilar y no se beneficia de la caché de Cargo.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      # Falla solo ante vulnerabilidades. Los avisos de «unmaintained» y
      # «unsound» se reportan pero no bloquean: hoy son 9, todos transitivos de
      # la pila GTK de Tauri (unic-*, glib) y no accionables desde este
      # repositorio. Para bloquear también con ellos: --deny warnings, en cuanto
      # unic-* y glib dejen de llegar a través de Tauri.
      - name: Auditar dependencias de Rust
        run: cargo audit --file src-tauri/Cargo.lock
