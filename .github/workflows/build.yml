name: build

# Cantoral targets macOS and Windows. Each installer is produced on its own
# native runner (cross-compiling Tauri desktop bundles is not supported).
#
# Flujo al publicar una versión:
#   verify  → la etiqueta coincide con la versión declarada y todo pasa en verde
#   build   → instaladores de macOS y Windows, en paralelo
#   release → GitHub Release con las notas del CHANGELOG.md y los binarios adjuntos
#
# Code signing is entirely optional: every secret below may be absent, in which
# case the bundles are still produced, just unsigned. See README → «Firma de
# código» for the list of secrets and how to generate them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nada se compila ni se publica si la versión no cuadra o si las pruebas fallan.
  # Barato (un runner de Linux, unos minutos) comparado con descubrirlo cuando el
  # release ya está publicado y descargado.
  verify:
    name: Verificar versión y pruebas
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: La etiqueta coincide con la versión declarada
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_v=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

          # tauri.conf.json no lleva número propio: lo toma de package.json.
          # Comprobar que sigue delegando es más fuerte que comparar dos
          # números, porque impide que alguien vuelva a escribirlo a mano.
          if [ "$tauri" != "../package.json" ]; then
            echo "::error::src-tauri/tauri.conf.json debe decir \"version\": \"../package.json\", no $tauri."
            exit 1
          fi

          # Cargo.toml es la única copia que queda; nada la sincroniza sola.
          if [ "$cargo_v" != "$pkg" ]; then
            echo "::error::src-tauri/Cargo.toml dice $cargo_v y package.json dice $pkg. Deben coincidir."
            exit 1
          fi

          # En workflow_dispatch no hay etiqueta que comparar; solo se avisa.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::la etiqueta $GITHUB_REF_NAME no corresponde a la versión $pkg."
              exit 1
            fi
          fi
          echo "Versión $pkg verificada."

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            build-essential file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Compilar (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: cantoral-macos
            # El .tar.gz y su .sig son lo que descarga el actualizador; solo
            # aparecen cuando hay clave de firma.
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - platform: windows-latest
            artifact: cantoral-windows
            paths: |
              src-tauri/target/release/Cantoral.exe
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      # Windows Authenticode. Imports the .pfx into the runner's certificate
      # store and reports its thumbprint, which the build step feeds to Tauri.
      # No-ops (leaving the thumbprint output empty) when the secret is unset.
      - name: Import Windows signing certificate
        id: winsign
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No WINDOWS_CERTIFICATE secret configured — building unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cantoral-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build Cantoral
        shell: bash
        env:
          # Firma del actualizador. Es independiente de la firma de código de
          # Apple y Microsoft: con esta clave las actualizaciones quedan
          # verificadas criptográficamente aunque el bundle siga sin firmar.
          # Si el secret no está, no se generan artefactos de actualización y
          # el release sale como siempre.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization. Tauri las lee solas; las vacías se
          # quitan abajo antes de compilar, porque «vacía» y «ausente» no son
          # lo mismo para quien solo mira si la variable existe.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Un secret que no existe llega como cadena **vacía**, no ausente.
          # Tauri solo mira si la variable está definida, así que con
          # APPLE_CERTIFICATE="" intentaba `security import` de un certificado
          # vacío y el bundle de macOS moría con «SecKeychainItemImport: One or
          # more parameters passed to a function were not valid», después de
          # seis minutos de compilación. Solo llegan al build las que traen algo.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                     TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done

          overrides='{}'
          thumbprint="${{ steps.winsign.outputs.thumbprint }}"
          if [ -n "$thumbprint" ]; then
            # Passed on the command line so the thumbprint never lands in the repo.
            overrides=$(node -e '
              const o = JSON.parse(process.argv[1]);
              o.bundle = { ...o.bundle, windows: { certificateThumbprint: process.argv[2],
                digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com" } };
              process.stdout.write(JSON.stringify(o));
            ' "$overrides" "$thumbprint")
          fi
          # Los artefactos de actualización solo se pueden firmar si hay clave;
          # sin ella se compila igual, solo que ese release no actualizará a
          # nadie. La clave pública vive en tauri.conf.json.
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            overrides=$(node -e '
              const o = JSON.parse(process.argv[1]);
              o.bundle = { ...o.bundle, createUpdaterArtifacts: true };
              process.stdout.write(JSON.stringify(o));
            ' "$overrides")
          else
            echo "::warning::sin TAURI_SIGNING_PRIVATE_KEY: este release no podrá actualizar instalaciones existentes."
          fi
          if [ "$overrides" = "{}" ]; then
            pnpm tauri build
          else
            pnpm tauri build --config "$overrides"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: warn

  # Publishes the installers on the tag so people outside GitHub can download
  # them. Artifacts alone are only reachable from the workflow run page.
  release:
    name: Publicar release
    needs: [verify, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Reunir los instaladores
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          # El bundle .app es un directorio y no sirve como asset de release; lo
          # que la gente descarga son el .dmg, el .msi y el .exe. El .tar.gz de
          # macOS no se descarga a mano, pero es lo que pide el actualizador.
          assets=()
          while IFS= read -r f; do assets+=("$f"); done < <(find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.app.tar.gz' \) \
            ! -path '*/Cantoral.app/*' | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no installers found in the build artifacts"
            exit 1
          fi
          printf 'asset: %s\n' "${assets[@]}"
          printf '%s\n' "${assets[@]}" > assets.txt

      # El actualizador pide un manifiesto que Tauri no genera: se arma aquí a
      # partir de los .sig que dejó cada compilación. Sin .sig no hay
      # manifiesto, y el release se publica igual — solo que sin actualizar a
      # nadie, que es exactamente lo que pasa hoy.
      - name: Armar latest.json
        id: manifest
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! find artifacts -type f -name '*.sig' | grep -q .; then
            echo "::warning::sin firmas del actualizador; no se publica latest.json."
            echo "hay=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node .github/scripts/latest-json.mjs > latest.json
          cat latest.json
          echo "hay=sí" >> "$GITHUB_OUTPUT"

      - name: Redactar las notas
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail

          # Sección de esta versión en el CHANGELOG, sin su encabezado.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/       { exit }
            inside                   { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > changelog-section.md

          if [ -s changelog-section.md ]; then
            { echo "## Novedades"; echo; cat changelog-section.md; } > notes.md
          else
            echo "::warning::CHANGELOG.md no tiene una sección para $VERSION; se usarán las notas automáticas."
            : > notes.md
          fi

          # Una suma por instalador, calculada sobre los mismos archivos que se
          # suben. Mientras no existan los certificados de firma, es lo único
          # que permite comprobar que lo descargado es lo que se publicó aquí.
          while IFS= read -r f; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
          done < assets.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # El pie fijo vive en .github/release-notes.md: es Markdown, y dentro
          # de un `run: |` no puede empezar en la columna cero —la YAML se
          # rompe— pero con sangría GitHub lo pinta como bloque de código. Del
          # archivo salen las dos mitades, con las sumas entre medias.
          marcador='<!-- SHA256SUMS -->'
          {
            echo
            sed "/$marcador/q" .github/release-notes.md | sed '$d'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            sed -n "/$marcador/,\$p" .github/release-notes.md | sed '1d'
          } >> notes.md

      - name: Publicar GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < assets.txt

          # Sin sección en el CHANGELOG, que GitHub redacte las notas por commits
          # y las añada debajo de las de notes.md.
          extra=()
          if [ ! -s changelog-section.md ]; then extra=(--generate-notes); fi

          # `latest.json` va como un asset más: el endpoint del actualizador
          # apunta a releases/latest/download/latest.json, que GitHub resuelve
          # siempre al último release publicado.
          if [ -f latest.json ]; then assets+=(latest.json); fi
          # Como asset, para que `shasum -a 256 -c SHA256SUMS.txt` funcione sin
          # copiar las sumas a mano desde las notas.
          if [ -f SHA256SUMS.txt ]; then assets+=(SHA256SUMS.txt); fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cantoral $GITHUB_REF_NAME" \
            --notes-file notes.md \
            ${extra[@]+"${extra[@]}"} \
            "${assets[@]}"
