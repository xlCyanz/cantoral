version: 2

# Actualizaciones agrupadas y semanales: un PR por ecosistema en vez de uno por
# dependencia, para que revisar no se vuelva un trabajo a tiempo completo.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      # typescript-eslint soporta TypeScript >=4.8.4 <6.1.0 y aborta con un error
      # duro fuera de ese rango, así que TS 7 deja el linter inservible. El bump
      # se acepta de nuevo cuando esto se cierre:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tauri:
        patterns: ["@tauri-apps/*"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
